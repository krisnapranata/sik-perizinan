# Nginx internal SIK Perizinan (container sik_nginx, port host 8040).
# Di depannya: Nginx Proxy Manager yang memegang domain + sertifikat HTTPS.

# Teruskan protokol asli dari Nginx Proxy Manager; bila diakses langsung, pakai $scheme.
map $http_x_forwarded_proto $proto_asli {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Membatasi tebak password dan tebak nomor registrasi. Hanya POST login yang dihitung:
# petugas di kantor bisa berbagi satu IP publik, jadi membuka halaman tidak boleh kena batas.
# $binary_remote_addr = IP asli pemohon (lihat real_ip di bawah), bukan IP NPM.
map $request_method $sik_kunci_masuk {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $sik_kunci_masuk zone=sik_masuk:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=sik_cek:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Backend dipanggil dengan NAMA CONTAINER yang unik (sik_web), bukan nama service "web":
    # sik_nginx juga tergabung di network Nginx Proxy Manager, tempat aplikasi lain (SIMBAK, E-Office)
    # punya service bernama "web". Resolver Docker + variabel membuat alamat dibaca ulang (valid=10s)
    # sehingga tetap benar setelah sik_web dibuat ulang dengan IP baru.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sik_web http://sik_web:8000;

    # Percayai X-Real-IP hanya dari jaringan privat (NPM/docker), untuk log & batas login.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Aplikasi mengunggah satu berkas (maks. 5 MB) per request; ekspor OSS-RBA bisa besar.
    # Samakan di Nginx Proxy Manager (Advanced: client_max_body_size 30m;).
    client_max_body_size 30m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    # Berkas pemohon adalah data pribadi: tidak ada URL publik.
    # Hanya bisa dicapai lewat X-Accel-Redirect setelah Django memeriksa izin.
    location /_berkas/ {
        internal;
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location = /akun/masuk/ {
        limit_req zone=sik_masuk burst=20 nodelay;
        include /etc/nginx/conf.d/sik-proxy.inc;
    }

    location = /cek-status/ {
        limit_req zone=sik_cek burst=20 nodelay;
        include /etc/nginx/conf.d/sik-proxy.inc;
    }

    location / {
        include /etc/nginx/conf.d/sik-proxy.inc;
    }
}
