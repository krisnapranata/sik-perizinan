# SIK Perizinan DPMPTSP Lombok Timur — produksi (pola sama dengan SIMBAK/E-Office). Jalankan dari folder ini:
#   cp deploy/env.production.contoh .env.production && cp deploy/env.db.contoh .env.db   # lalu isi
#   docker compose up -d --build
# Container & volume diberi awalan "sik" supaya tidak bentrok dengan aplikasi lain.
# Di depannya: Nginx Proxy Manager (domain + HTTPS) → sik_nginx:80.
name: sik

services:
  db:
    image: mariadb:10.11
    container_name: sik_db
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    env_file: .env.db
    environment:
      TZ: Asia/Makassar
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: .
    image: sik-web:latest
    container_name: sik_web
    restart: unless-stopped
    env_file: .env.production
    environment:
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media          # berkas pemohon (data pribadi), diunduh lewat Django setelah cek izin

  nginx:
    image: nginx:1.27-alpine
    container_name: sik_nginx
    restart: unless-stopped
    ports:
      - "${SIK_PORT:-8040}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/sik-proxy.inc:/etc/nginx/conf.d/sik-proxy.inc:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - default
      - npm   # supaya Nginx Proxy Manager bisa memanggil "sik_nginx:80" tanpa IP

networks:
  # Network milik Nginx Proxy Manager (sama dengan SIMBAK/E-Office). Cek nama di server:
  #   docker inspect proxy-npm-1 -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
  # Bila berbeda: tulis NPM_NETWORK=nama_network di file .env (folder ini), lalu docker compose up -d
  npm:
    external: true
    name: ${NPM_NETWORK:-proxy_default}

volumes:
  db_data:
  static:
  media:
