# Nginx reverse proxy HTTPS untuk SIK Perizinan
# Ganti server_name dengan domain dinas

# Membatasi tebak password dan tebak nomor registrasi. Hanya POST login yang dihitung:
# petugas di kantor bisa berbagi satu IP publik, jadi membuka halaman tidak boleh kena batas.
map $request_method $sik_kunci_masuk {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $sik_kunci_masuk zone=sik_masuk:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=sik_cek:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Batas per request. Aplikasi mengunggah satu berkas (maks. 5 MB) per request.
    client_max_body_size 30M;  # file ekspor OSS-RBA bisa besar

    location /static/ {
        alias /var/www/static/;
        expires 7d;
    }

    # Berkas pemohon adalah data pribadi: tidak ada URL publik.
    # Hanya bisa dicapai lewat X-Accel-Redirect setelah Django memeriksa izin.
    location /_berkas/ {
        internal;
        alias /var/www/media/;
    }

    location = /akun/masuk/ {
        limit_req zone=sik_masuk burst=20 nodelay;
        include /etc/nginx/conf.d/sik-proxy.inc;
    }

    location = /cek-status/ {
        limit_req zone=sik_cek burst=20 nodelay;
        include /etc/nginx/conf.d/sik-proxy.inc;
    }

    location / {
        include /etc/nginx/conf.d/sik-proxy.inc;
    }
}
