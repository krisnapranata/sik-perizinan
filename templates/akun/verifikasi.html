{% extends "base.html" %}{% block judul %}Verifikasi akun{% endblock %}
{% block isi %}<div class="kartu" style="padding:28px">
<h1 style="font-size:1.4rem;margin-bottom:6px">Masukkan kode verifikasi</h1>
<p class="redup" style="margin:0 0 20px">Kode 6 digit sudah dikirim ke <b>{{ email }}</b>. Kode berlaku 15 menit. Tidak ada di kotak masuk? Periksa folder spam.</p>
<form method="post">{% csrf_token %}{{ form.as_div }}<button class="aksen" style="width:100%">Verifikasi</button></form>
<form method="post" action="{% url 'akun:kirim_ulang_otp' %}" style="margin-top:12px">{% csrf_token %}<button class="garis" style="width:100%">Kirim ulang kode</button></form>
</div>{% endblock %}
